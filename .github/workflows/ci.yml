name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brandpulse_test
          POSTGRES_USER: brandpulse
          POSTGRES_PASSWORD: brandpulse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brandpulse -d brandpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://brandpulse:brandpulse_dev@localhost:5432/brandpulse_test
      TEST_DATABASE_URL: postgresql+asyncpg://brandpulse:brandpulse_dev@localhost:5432/brandpulse_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Check Compose configuration
        run: docker compose config -q

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
